<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyProfile</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-inner">

      <a href="index.html" class="home">
        <h1>MyProfile</h1>
      </a>

      <nav>
        <ul class="menu">
          <li><a href="#about">About</a></li>
          <li><a href="#works">Works</a></li>
        </ul>
      </nav>

    </div>
  </header>


  <main>

    <!-- メイン画像 -->
    <div>
      <img src="images/main.png" alt="メイン画像">
    </div>


    <!-- About -->
    <section id="about">

      <h2>About</h2>

      <div class="about-inner">

        <img src="images/about.png" alt="プロフィール写真" class="circle">

        <div class="content">
          <p class="name">Kazuki Asahina</p>

          <ul>
            <li>25歳 東京都出身</li>
            <li>フリーカメラマンとして活動</li>
            <li>趣味はカメラ、登山、旅行</li>
            <li>自然な写真を撮るのが好きです</li>
          </ul>
        </div>

      </div>

    </section>


    <!-- Works -->
    <section id="works">

      <h2>Works</h2>

      <div class="works-inner">

        <div class="item">
          <img src="images/works1.png" alt="作品1">
          <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した一枚</p>
        </div>

        <div class="item">
          <img src="images/works2.png" alt="作品2">
          <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
        </div>

        <div class="item">
          <img src="images/works3.png" alt="作品3">
          <p>京都で撮影した、明け方の古き良き日本の町並み</p>
        </div>

      </div>

    </section>

  </main>


  <!-- フッター -->
  <footer>
    <p>© MyProfile. All rights reserved.</p>
  </footer>

</body>

</html>
